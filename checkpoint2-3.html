<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gửi tin tức</title>
    <link rel="stylesheet" href="checkpoint2-3.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="checkpoint2-1.html">tin tức</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="checkpoint2-1.html">trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="checkpoint2-3.html">gửi tin tức</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4 text-primary">gửi tin tức ở đây</h2>
                    <form action="#" method="POST">
                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">tiêu đề</label>
                            <input type="text" class="form-control" id="title" placeholder="nhập tiêu đề" required>
                        </div>

                        <div class="mb-3">
                            <label for="image" class="form-label fw-bold">link hình ảnh</label>
                            <input type="url" class="form-control" id="image" placeholder="gửi link vào đây" required>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label fw-bold">nội dung</label>
                            <textarea class="form-control" id="content" rows="5" placeholder="nhập nội dung" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fs-5">gửi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
